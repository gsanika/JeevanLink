<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JeevanLink — Reports</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: var(--bg); }
    .container { max-width: 1200px; margin: 0 auto; padding: 28px 20px 80px; display: flex; flex-direction: column; gap: 18px; }
    .report-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; }
    .panel { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .panel-header { padding: 16px 18px; border-bottom: 1px solid var(--border); }
    .panel-body { padding: 18px; }
    .chart-bar { display: flex; align-items: end; gap: 12px; height: 220px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .bar-fill { width: 100%; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, var(--medium), var(--brand)); min-height: 20px; }
    .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .legend-row { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12px; }
    .stats-card { display: flex; flex-direction: column; gap: 12px; }
    .mini-stat { border: 1px solid var(--border); background: var(--bg-2); border-radius: var(--radius); padding: 12px 14px; }
    .mini-stat strong { display: block; font-size: 24px; font-family: var(--font-mono); }
    @media (max-width: 900px) { .report-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="toolbar">
      <div>
        <h1 style="font-size:32px; letter-spacing:-0.05em; margin:0;">Operational reports</h1>
        <p style="margin-top:6px; color:var(--text-2);">Response performance and team analytics</p>
      </div>
      <div class="action-row">
        <a class="btn ghost" href="/dashboard.html">Dashboard</a>
        <a class="btn primary" href="/operations.html">Dispatch</a>
      </div>
    </div>

    <div class="report-grid">
      <div class="panel">
        <div class="panel-header"><h3>Incidents this week</h3></div>
        <div class="panel-body">
          <div class="chart-bar">
            <div class="bar-col"><div class="bar-fill" style="height: 40%"></div><span>Mon</span></div>
            <div class="bar-col"><div class="bar-fill" style="height: 70%"></div><span>Tue</span></div>
            <div class="bar-col"><div class="bar-fill" style="height: 55%"></div><span>Wed</span></div>
            <div class="bar-col"><div class="bar-fill" style="height: 88%"></div><span>Thu</span></div>
            <div class="bar-col"><div class="bar-fill" style="height: 62%"></div><span>Fri</span></div>
          </div>
          <div class="legend">
            <div class="legend-row"><span>Critical incidents</span><strong>03</strong></div>
            <div class="legend-row"><span>High severity</span><strong>08</strong></div>
            <div class="legend-row"><span>Resolved within target</span><strong>91%</strong></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h3>Summary</h3></div>
        <div class="panel-body stats-card">
          <div class="mini-stat">
            <span class="badge ok">Avg response</span>
            <strong>08m</strong>
          </div>
          <div class="mini-stat">
            <span class="badge medium">Coverage</span>
            <strong>92%</strong>
          </div>
          <div class="mini-stat">
            <span class="badge critical">Escalations</span>
            <strong>05</strong>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
