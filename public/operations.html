<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JeevanLink — Operations Console</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: var(--bg); }
    .page-shell { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; display: flex; flex-direction: column; gap: 18px; }
    .hero-bar {
      background: linear-gradient(135deg, rgba(232,72,76,0.12), rgba(59,158,255,0.08)); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 22px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .hero-copy h1 { font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.05em; }
    .hero-copy p { margin-top: 6px; color: var(--text-2); }
    .mission-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .mission-card {
      border: 1px solid var(--border); background: var(--bg-1); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px;
    }
    .mission-card .value { font-size: 30px; font-family: var(--font-mono); font-weight: 800; }
    .mission-card .value.critical { color: var(--critical-text); }
    .mission-card .value.high { color: var(--high-text); }
    .mission-card .value.ok { color: var(--ok); }
    .mission-card .value.info { color: var(--medium-text); }
    .layout-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 18px; }
    .panel { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
    .panel-header h3 { font-size: 14px; }
    .panel-body { padding: 18px; }
    .dispatch-list { display: flex; flex-direction: column; gap: 12px; }
    .dispatch-item {
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-2); padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    }
    .dispatch-item strong { display: block; margin-bottom: 4px; }
    .dispatch-item small { color: var(--text-2); }
    .team-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); }
    .team-card .left { display: flex; align-items: center; gap: 10px; }
    .team-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--brand-dim); border: 1px solid rgba(232,72,76,0.3); }
    .team-matrix { display: flex; flex-direction: column; gap: 12px; }
    .team-meta { font-size: 12px; color: var(--text-2); }
    .tiny-bar { width: 100%; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); overflow: hidden; }
    .tiny-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--medium)); }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 820px) {
      .mission-grid, .layout-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .mission-grid, .layout-grid { grid-template-columns: 1fr; }
      .hero-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="hero-bar">
      <div class="hero-copy">
        <h1>Operations console</h1>
        <p>Coordinate response teams, dispatch coverage, and monitor the rescue flow.</p>
      </div>
      <div class="action-row">
        <a class="btn ghost" href="/dashboard.html">Return to dashboard</a>
        <a class="btn primary" href="/network.html">Network health</a>
      </div>
    </div>

    <div class="mission-grid">
      <div class="mission-card">
        <div class="badge critical">Live</div>
        <div class="value critical">03</div>
        <div class="meta">Critical incidents</div>
      </div>
      <div class="mission-card">
        <div class="badge high">Active</div>
        <div class="value high">08</div>
        <div class="meta">Units dispatched</div>
      </div>
      <div class="mission-card">
        <div class="badge ok">Ready</div>
        <div class="value ok">12</div>
        <div class="meta">Teams on standby</div>
      </div>
      <div class="mission-card">
        <div class="badge medium">ETA</div>
        <div class="value info">08m</div>
        <div class="meta">Average response</div>
      </div>
    </div>

    <div class="layout-grid">
      <div class="panel">
        <div class="panel-header">
          <h3>Dispatch queue</h3>
          <div class="filter-row">
            <button class="tab-pill active">All</button>
            <button class="tab-pill">Critical</button>
            <button class="tab-pill">Priority</button>
          </div>
        </div>
        <div class="panel-body dispatch-list" id="dispatchList"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h3>Field teams</h3><span class="chip online">Coverage ready</span></div>
        <div class="panel-body team-matrix" id="teamMatrix"></div>
      </div>
    </div>
  </main>

  <script>
    const dispatchItems = [
      { title: 'Structure collapse near sector 4', severity: 'critical', eta: '4 min', status: 'Assigned' },
      { title: 'Traffic accident with trapped driver', severity: 'high', eta: '7 min', status: 'En route' },
      { title: 'Medical emergency in residential block', severity: 'medium', eta: '10 min', status: 'Queued' }
    ];

    const teams = [
      { name: 'Alpha Rescue', type: 'Fire team', coverage: 88, status: 'Ready' },
      { name: 'Blue Medic', type: 'Medical unit', coverage: 72, status: 'Deploying' },
      { name: 'Delta Search', type: 'Search & rescue', coverage: 91, status: 'Ready' }
    ];

    const dispatchList = document.getElementById('dispatchList');
    const teamMatrix = document.getElementById('teamMatrix');

    dispatchList.innerHTML = dispatchItems.map((item) => `
      <div class="dispatch-item">
        <div>
          <strong>${item.title}</strong>
          <small>${item.status} · ${item.eta}</small>
        </div>
        <div class="badge ${item.severity === 'critical' ? 'critical' : item.severity === 'high' ? 'high' : 'medium'}">${item.severity}</div>
      </div>
    `).join('');

    teamMatrix.innerHTML = teams.map((team) => `
      <div class="team-card">
        <div class="left">
          <div class="team-icon">🚑</div>
          <div>
            <strong>${team.name}</strong>
            <div class="team-meta">${team.type} · ${team.status}</div>
          </div>
        </div>
        <div style="min-width: 110px;">
          <div class="tiny-bar"><span style="width: ${team.coverage}%"></span></div>
          <div class="team-meta" style="margin-top: 6px; text-align: right;">${team.coverage}%</div>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
