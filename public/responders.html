<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JeevanLink — Responders</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: var(--bg); }
    .container { max-width: 1200px; margin: 0 auto; padding: 28px 20px 80px; display: flex; flex-direction: column; gap: 18px; }
    .team-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
    .team-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }
    .team-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--brand-dim); border: 1px solid rgba(232,72,76,0.3); }
    .stats { display: flex; flex-direction: column; gap: 10px; }
    .stat-row { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12px; }
    .bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--medium)); }
    @media (max-width: 900px) { .team-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="toolbar">
      <div>
        <h1 style="font-size:32px; letter-spacing:-0.05em; margin:0;">Responder roster</h1>
        <p style="margin-top:6px; color:var(--text-2);">Live team availability and readiness</p>
      </div>
      <div class="action-row">
        <a class="btn ghost" href="/dashboard.html">Back</a>
        <a class="btn primary" href="/operations.html">Operations</a>
      </div>
    </div>

    <div class="team-grid">
      <div class="team-card">
        <div class="team-head">
          <div class="profile"><div class="avatar">🚑</div><div><strong>Alpha Rescue</strong><div class="team-meta">Fire team</div></div></div>
          <span class="badge ok">Ready</span>
        </div>
        <div class="stats">
          <div class="stat-row"><span>Coverage</span><strong>88%</strong></div>
          <div class="bar"><span style="width:88%"></span></div>
          <div class="stat-row"><span>ETA to site</span><strong>4 min</strong></div>
          <div class="stat-row"><span>Units</span><strong>5</strong></div>
        </div>
      </div>

      <div class="team-card">
        <div class="team-head">
          <div class="profile"><div class="avatar">🩺</div><div><strong>Blue Medic</strong><div class="team-meta">Medical unit</div></div></div>
          <span class="badge high">Deploying</span>
        </div>
        <div class="stats">
          <div class="stat-row"><span>Coverage</span><strong>72%</strong></div>
          <div class="bar"><span style="width:72%"></span></div>
          <div class="stat-row"><span>ETA to site</span><strong>7 min</strong></div>
          <div class="stat-row"><span>Units</span><strong>3</strong></div>
        </div>
      </div>

      <div class="team-card">
        <div class="team-head">
          <div class="profile"><div class="avatar">🚨</div><div><strong>Delta Search</strong><div class="team-meta">Search & rescue</div></div></div>
          <span class="badge ok">Ready</span>
        </div>
        <div class="stats">
          <div class="stat-row"><span>Coverage</span><strong>91%</strong></div>
          <div class="bar"><span style="width:91%"></span></div>
          <div class="stat-row"><span>ETA to site</span><strong>3 min</strong></div>
          <div class="stat-row"><span>Units</span><strong>6</strong></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
